name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eskoofy-laravel-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, zip, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: eskoofy-laravel-app/package-lock.json

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Composer audit (dependencies)
        run: composer audit

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Pint (code style check)
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: composer test

  php-test:
    name: eskoofy-php-app Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eskoofy-php-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Composer audit (dependencies)
        run: composer audit

      - name: Run tests
        run: composer test

  website-test:
    name: eskoofy-branding-website Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eskoofy-branding-website
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Composer audit (dependencies)
        run: composer audit

      - name: Run tests
        run: composer test


  node-test:
    name: eskoofy-nodejs-app Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eskoofy-nodejs-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: eskoofy-nodejs-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: App ↔ node sidebar parity
        run: npm run route:parity

  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hardcoded-credential grep (fail fast)
        run: |
          set -e
          ! rg -n --hidden -g '!.git' -g '!vendor/**' -g '!node_modules/**' -g '!archive/**'             -g '!*.md' -g '!*.lock' -g '!*.po' -g '!*.pot' -g '!*.mo'             -i 'BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|sk_live_|sk_test_|AKIA[0-9A-Z]{16}' .
  theme-lint:
    name: Theme Lint (PHPCS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eskoofy-wp-theme
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Composer audit (dependencies)
        run: composer audit

      - name: Run PHPCS
        run: ./vendor/bin/phpcs

  export:
    name: Export Artifacts
    runs-on: ubuntu-latest
    needs: [test, php-test, website-test, theme-lint, security]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath

      - name: Export BD app
        run: ./build/export.sh app bd

      - name: Export INT app
        run: ./build/export.sh app int

      - name: Export BD theme
        run: ./build/export.sh theme bd

      - name: Export INT theme
        run: ./build/export.sh theme int

      - name: Export BD php
        run: ./build/export.sh php bd

      - name: Export INT php
        run: ./build/export.sh php int

      - name: Export website (English-only licensing site)
        run: ./build/export.sh website int

      - name: Export BD node
        run: ./build/export.sh node bd

      - name: Export INT node
        run: ./build/export.sh node int

      - name: Verify BD artifact exists
        run: test -f build/dist/eskoofy-laravel-app-bd.zip

      - name: Verify INT artifact exists
        run: test -f build/dist/eskoofy-laravel-app-int.zip

      - name: Verify BD theme artifact exists
        run: test -f build/dist/eskoofy-wp-theme-bd.zip

      - name: Verify INT theme artifact exists
        run: test -f build/dist/eskoofy-wp-theme-int.zip

      - name: Verify BD php artifact exists
        run: test -f build/dist/eskoofy-php-app-bd.zip

      - name: Verify INT php artifact exists
        run: test -f build/dist/eskoofy-php-app-int.zip

      - name: Verify BD node artifact exists
        run: test -f build/dist/eskoofy-nodejs-app-bd.zip

      - name: Verify INT node artifact exists
        run: test -f build/dist/eskoofy-nodejs-app-int.zip

      - name: Verify website artifact exists
        run: test -f build/dist/eskoofy-branding-website-int.zip

      - name: Verify website artifact is English-only / int variant
        run: |
          if unzip -p build/dist/eskoofy-branding-website-int.zip "eskoofy-branding-website-int/.env" | grep -q "APP_LOCALE=bn"; then
            echo "error: website artifact is not English-only"
            exit 1
          fi

      - name: Smoke — INT app has no lang/bn
        run: |
          if unzip -l build/dist/eskoofy-laravel-app-int.zip | grep -q "lang/bn/"; then
            echo "error: bn lang pack leaked into int artifact"
            exit 1
          fi

      - name: Smoke — BD app has lang/bn
        run: |
          if ! unzip -l build/dist/eskoofy-laravel-app-bd.zip | grep -q "lang/bn/"; then
            echo "error: bd artifact missing lang/bn"
            exit 1
          fi

      - name: Smoke — INT php has no lang/bn
        run: |
          if unzip -l build/dist/eskoofy-php-app-int.zip | grep -q "lang/bn/"; then
            echo "error: bn lang pack leaked into int php artifact"
            exit 1
          fi

      - name: Smoke — BD php has lang/bn
        run: |
          if ! unzip -l build/dist/eskoofy-php-app-bd.zip | grep -q "lang/bn/"; then
            echo "error: bd php artifact missing lang/bn"
            exit 1
          fi

      - name: Smoke — INT php .env is variant int
        run: |
          if unzip -p build/dist/eskoofy-php-app-int.zip "eskoofy-php-app-int/.env" | grep -q "ESKOOFY_VARIANT=bd"; then
            echo "error: int php artifact has bd variant"
            exit 1
          fi

      - name: Smoke — INT node has no lang/bn.ts
        run: |
          if unzip -l build/dist/eskoofy-nodejs-app-int.zip | grep -q "lang/bn.ts"; then
            echo "error: bn lang bundle leaked into int node artifact"
            exit 1
          fi

      - name: Smoke — BD node has lang/bn.ts
        run: |
          if ! unzip -l build/dist/eskoofy-nodejs-app-bd.zip | grep -q "lang/bn.ts"; then
            echo "error: bd node artifact missing lang/bn.ts"
            exit 1
          fi

      - name: Smoke — INT node .env is variant int
        run: |
          if unzip -p build/dist/eskoofy-nodejs-app-int.zip "eskoofy-nodejs-app-int/.env" | grep -q "ESKOOFY_VARIANT=bd"; then
            echo "error: int node artifact has bd variant"
            exit 1
          fi

      - name: Upload BD app artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskoofy-laravel-app-bd
          path: build/dist/eskoofy-laravel-app-bd.zip

      - name: Upload INT app artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskoofy-laravel-app-int
          path: build/dist/eskoofy-laravel-app-int.zip

      - name: Upload BD theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskoofy-wp-theme-bd
          path: build/dist/eskoofy-wp-theme-bd.zip

      - name: Upload INT theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskoofy-wp-theme-int
          path: build/dist/eskoofy-wp-theme-int.zip

      - name: Upload BD php artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskoofy-php-app-bd
          path: build/dist/eskoofy-php-app-bd.zip

      - name: Upload INT php artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskoofy-php-app-int
          path: build/dist/eskoofy-php-app-int.zip

      - name: Upload BD node artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskoofy-nodejs-app-bd
          path: build/dist/eskoofy-nodejs-app-bd.zip

      - name: Upload INT node artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskoofy-nodejs-app-int
          path: build/dist/eskoofy-nodejs-app-int.zip

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskoofy-branding-website-int
          path: build/dist/eskoofy-branding-website-int.zip
