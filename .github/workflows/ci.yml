name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eskoofy-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, zip, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: eskoofy-app/package-lock.json

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Pint (code style check)
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: composer test

  php-test:
    name: eskoofy-php Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eskoofy-php
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run tests
        run: composer test

  theme-lint:
    name: Theme Lint (PHPCS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eskoofy-theme
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHPCS
        run: ./vendor/bin/phpcs

  export:
    name: Export Artifacts
    runs-on: ubuntu-latest
    needs: [test, php-test, theme-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath

      - name: Export BD app
        run: ./build/export.sh app bd

      - name: Export INT app
        run: ./build/export.sh app int

      - name: Export BD theme
        run: ./build/export.sh theme bd

      - name: Export INT theme
        run: ./build/export.sh theme int

      - name: Export BD php
        run: ./build/export.sh php bd

      - name: Export INT php
        run: ./build/export.sh php int

      - name: Verify BD artifact exists
        run: test -f build/dist/eskoofy-app-bd.zip

      - name: Verify INT artifact exists
        run: test -f build/dist/eskoofy-app-int.zip

      - name: Verify BD theme artifact exists
        run: test -f build/dist/eskoofy-theme-bd.zip

      - name: Verify INT theme artifact exists
        run: test -f build/dist/eskoofy-theme-int.zip

      - name: Verify BD php artifact exists
        run: test -f build/dist/eskoofy-php-bd.zip

      - name: Verify INT php artifact exists
        run: test -f build/dist/eskoofy-php-int.zip

      - name: Smoke — INT app has no lang/bn
        run: |
          if unzip -l build/dist/eskoofy-app-int.zip | grep -q "lang/bn/"; then
            echo "error: bn lang pack leaked into int artifact"
            exit 1
          fi

      - name: Smoke — BD app has lang/bn
        run: |
          if ! unzip -l build/dist/eskoofy-app-bd.zip | grep -q "lang/bn/"; then
            echo "error: bd artifact missing lang/bn"
            exit 1
          fi

      - name: Smoke — INT php has no lang/bn
        run: |
          if unzip -l build/dist/eskoofy-php-int.zip | grep -q "lang/bn/"; then
            echo "error: bn lang pack leaked into int php artifact"
            exit 1
          fi

      - name: Smoke — BD php has lang/bn
        run: |
          if ! unzip -l build/dist/eskoofy-php-bd.zip | grep -q "lang/bn/"; then
            echo "error: bd php artifact missing lang/bn"
            exit 1
          fi

      - name: Smoke — INT php .env is variant int
        run: |
          if unzip -p build/dist/eskoofy-php-int.zip "eskoofy-php-int/.env" | grep -q "ESKOOFY_VARIANT=bd"; then
            echo "error: int php artifact has bd variant"
            exit 1
          fi

      - name: Upload BD app artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskoofy-app-bd
          path: build/dist/eskoofy-app-bd.zip

      - name: Upload INT app artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskoofy-app-int
          path: build/dist/eskoofy-app-int.zip

      - name: Upload BD theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskoofy-theme-bd
          path: build/dist/eskoofy-theme-bd.zip

      - name: Upload INT theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskoofy-theme-int
          path: build/dist/eskoofy-theme-int.zip

      - name: Upload BD php artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskoofy-php-bd
          path: build/dist/eskoofy-php-bd.zip

      - name: Upload INT php artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskoofy-php-int
          path: build/dist/eskoofy-php-int.zip
