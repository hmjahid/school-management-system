<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Eskoofy</title>
    <meta name="theme-color" content="#2563eb">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: linear-gradient(135deg, #0f172a 0%, #2563eb 100%);
               color: #f1f5f9; font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
        .card { text-align: center; padding: 48px 24px; max-width: 420px; }
        .mark { display: inline-flex; align-items: center; justify-content: center;
                width: 72px; height: 72px; border-radius: 18px; background: #0f172a;
                font-size: 40px; font-weight: 800; margin-bottom: 24px; }
        .mark span { color: #fff; }
        h1 { font-size: 26px; margin-bottom: 10px; }
        p { color: #cbd5e1; margin-bottom: 28px; line-height: 1.6; }
        button { background: #2563eb; color: #fff; border: 0; padding: 12px 28px;
                 border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        a { display: inline-block; margin-top: 14px; color: #93c5fd; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark"><span>E</span></div>
        <h1>You're offline</h1>
        <p>No internet connection right now. Try again once you're back online, or visit the Eskoofy homepage.</p>
        <button onclick="location.reload()">Try again</button>
        <br>
        <a href="/">Go to homepage</a>
    </div>
</body>
</html>
