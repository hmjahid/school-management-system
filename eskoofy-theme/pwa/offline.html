<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Eskoofy School</title>
<style>
	body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #111827; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 1rem; text-align: center; }
	.card { max-width: 420px; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 2.5rem 2rem; box-shadow: 0 10px 30px -12px rgba(2,6,23,.18); }
	h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
	p { color: #4b5563; line-height: 1.6; }
	a { display: inline-block; margin-top: 1rem; background: #2563eb; color: #fff; text-decoration: none; padding: .7rem 1.4rem; border-radius: 999px; font-weight: 600; }
</style>
</head>
<body>
	<div class="card">
		<h1>You are offline</h1>
		<p>It looks like you've lost your connection. Please check your network and try again. Your last-loaded pages are still available.</p>
		<a href="/">Back to home</a>
	</div>
</body>
</html>
