<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — SchoolEase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f8fafc; color: #334155; }
        .container { text-align: center; max-width: 420px; padding: 2rem; }
        .icon { width: 80px; height: 80px; margin: 0 auto 1.5rem; background: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .icon svg { width: 40px; height: 40px; color: #94a3b8; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        p { color: #64748b; margin-bottom: 1.5rem; line-height: 1.6; }
        button { background: #2563eb; color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 0.5rem; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728M5.636 18.364a9 9 0 010-12.728m12.728 0A9 9 0 015.636 18.364m12.728-12.728L5.636 18.364"/></svg>
        </div>
        <h1>You're offline</h1>
        <p>Please check your internet connection and try again.</p>
        <button onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
